section[data-marpit-advanced-background-split]{width:100%;height:100%}</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-paginate="true" data-class="title-slide" data-theme="sft" class="title-slide" data-marpit-pagination="1" style="--paginate:true;--class:title-slide;--theme:sft;" data-marpit-pagination-total="27"><div class="kicker">Large Language Models</div>
<h1 id="supervised-fine-tuning">Supervised Fine-Tuning</h1>
<h1 id="sft">(SFT)</h1>
<div class="byline">Teaching LLMs to Formulate Text &amp; Follow Instructions<br />Yakov &middot; September 2026</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="center-body" data-theme="sft" class="center-body" data-marpit-pagination="2" style="--paginate:true;--class:center-body;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="the-llm-alignment-pipeline">The LLM Alignment Pipeline</h1>
<div class="flow-steps">
  <div class="step">Pre-training<br /><small>(Base Model)</small></div>
  <div class="arrow">&rarr;</div>
  <div class="step highlight">SFT<br /><small>(Instruction Model)</small></div>
  <div class="arrow">&rarr;</div>
  <div class="step">RLHF / DPO<br /><small>(Human Preferences)</small></div>
</div>
<ul>
<li><strong>Pre-training:</strong> web-scale raw knowledge and language structure acquisition.</li>
<li><strong>SFT:</strong> teaching interaction formats, tasks, and system behaviors.</li>
<li><strong>RLHF/DPO:</strong> micro-tuning behavior to meet safety standards and human feedback.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="sft" data-marpit-pagination="3" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="two-purposes-of-sft">Two Purposes of SFT</h1>
<div class="mini-cols mini-cols-lg">
  <div class="mini-col">
    <div class="mini-title">Alignment SFT</div>
    <p class="mini-note">Base completion model &rarr; general instruction-following assistant.</p>
    <p class="small-note">Teaches the model to treat <em>any</em> instruction as something to act on, not just continue. Foundational, one-time — shown on the next slide.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">Domain / Application SFT</div>
    <p class="mini-note">Instruction-tuned model &rarr; specialized behavior for one product or task.</p>
    <p class="small-note">The model already follows instructions — this teaches it <em>your</em> schema, vocabulary, and edge cases. Shown a couple slides from now.</p>
  </div>
</div>
<div class="landscape-note">Same mechanism both times — masked next-token loss on instruction-formatted data, covered later in the deck — just a different starting checkpoint and a different goal. Prompt engineering is really an alternative to the second kind, not the first.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="sft" data-marpit-pagination="4" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="pre-training-vs-sft-the-mindset-shift">Pre-training vs. SFT (The Mindset Shift)</h1>
<div class="verdict-grid paired">
  <div class="verdict-pair">
    <div class="verdict-box bad">
      <div class="verdict-label">Base LLM — Text Completer</div>
      <p><strong>Prompt:</strong> Write a python function for quicksort.</p>
      <p><strong>Completion:</strong> Write a python function for mergesort.<br />Write a python function for binary search.<br />Write a python function for&hellip;</p>
    </div>
    <p class="verdict-clarification"><em>Chaos pattern:</em> treats the prompt as one item in a worksheet, not a request — keeps completing the list instead of answering it.</p>
  </div>
  <div class="verdict-pair">
    <div class="verdict-box good">
      <div class="verdict-label">SFT LLM — Helpful Assistant</div>
      <p><strong>Prompt:</strong> Write a python function for quicksort.</p>
      <p><strong>Completion:</strong><br /><code>def quicksort(arr): ... return arr</code></p>
    </div>
    <p class="verdict-clarification"><em>Alignment pattern:</em> transitions from pure raw completion to playing the persona of an assistant.</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="sft" data-marpit-pagination="5" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="domain-sft-in-practice-an-autonomous-driving-copilot">Domain SFT in Practice: An Autonomous-Driving Copilot</h1>
<div class="verdict-grid paired">
  <div class="verdict-pair">
    <div class="verdict-box bad">
      <div class="verdict-label">General Instruct Model</div>
      <p><strong>Prompt:</strong> Pedestrian at crosswalk distracted; truck in bike lane 20m ahead.</p>
      <p><strong>Completion:</strong> Moderate risk — distracted pedestrian near the crosswalk, truck blocking the bike lane ahead. Recommend slowing down.</p>
    </div>
    <p class="verdict-clarification"><em>Limitation:</em> correct but free-form prose — not parseable by a planner.</p>
  </div>
  <div class="verdict-pair">
    <div class="verdict-box good">
      <div class="verdict-label">Domain-SFT'd Driving Copilot</div>
      <p><strong>Prompt:</strong> (same)</p>
      <p><strong>Completion:</strong><br />
      <code>{"actors": [</code><br />
      <code>&nbsp;&nbsp;{"type": "VRU_pedestrian", "risk": "high"},</code><br />
      <code>&nbsp;&nbsp;{"type": "static_obstacle", "risk": "medium"}</code><br />
      <code>], "action": "reduce speed; widen clearance"}</code></p>
    </div>
    <p class="verdict-clarification"><em>Result:</em> same instruction-following base model, fine-tuned on the AV stack's own scenario logs to speak its schema and vocabulary.</p>
  </div>
</div>
<div class="landscape-note">The model didn't need to be taught to follow instructions here — it already could. Domain SFT only had to teach it <em>this</em> team's risk taxonomy and output format.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="sft" data-marpit-pagination="6" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="sft-data-not-free-not-web-scale">SFT Data: Not Free, Not Web-Scale</h1>
<div class="mini-cols mini-cols-lg">
  <div class="mini-col">
    <div class="mini-title">Pre-training Data</div>
    <p class="mini-note">Scraped from the open web — Common Crawl, books, code repos.</p>
    <p class="small-note">Trillions of tokens, collected essentially for free. Quality is uneven; the model learns language and knowledge from sheer volume.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">SFT Data</div>
    <p class="mini-note">Written or generated on purpose — by humans, or by a stronger "teacher" model, then filtered.</p>
    <p class="small-note">Thousands to low hundreds-of-thousands of examples. Every example costs real annotation or generation-plus-review effort.</p>
  </div>
</div>
<div class="decode-table-wrap">
  <table class="decode-table">
    <thead><tr><th>Dataset</th><th>Size</th><th>How it was made</th></tr></thead>
    <tbody>
      <tr><td>LIMA</td><td>1,000</td><td>Hand-curated by experts</td></tr>
      <tr><td>Dolly</td><td>15,000</td><td>Human-written by employees</td></tr>
      <tr><td>Alpaca</td><td>52,000</td><td>Self-Instruct — generated by GPT, lightly filtered</td></tr>
      <tr><td>Llama 2 (SFT)</td><td>~27,000</td><td>Vendor-curated, reported as "quality over quantity"</td></tr>
      <tr><td>OpenAssistant</td><td>~161,000</td><td>Crowd-sourced conversations</td></tr>
    </tbody>
  </table>
</div>
<div class="landscape-note">Orders of magnitude smaller than pre-training corpora — but rarely as small as LIMA's 1k in production. The next two slides explain what "curated" actually means, and why less can be more.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="sft" data-marpit-pagination="7" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="the-anatomy-of-an-instruction-example">The Anatomy of an Instruction Example</h1>
<p><strong>ChatML / OpenAI JSON template structure</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">[</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;system&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;You are a helpful coding assistant.&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;user&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;How do I reverse a list in Python?&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;assistant&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;You can reverse a list using `list.reverse()` or slicing `[::-1]`.&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">]</span>
</code></pre>
<div class="formula-box">[Prompt] + [Assistant] &rarr; Loss</div>
<p class="slide-caption"><strong>The Gold Target</strong> — loss is calculated ONLY on the assistant response.</p>
<ul>
<li><strong>System:</strong> defines boundaries/tone.</li>
<li><strong>User:</strong> input instructions — part of the context, not the target.</li>
<li><strong>Assistant:</strong> the training target — this is what the loss actually optimizes.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="sft" data-marpit-pagination="8" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="quality-over-quantity-the-lima-effect">Quality Over Quantity: The LIMA Effect</h1>
<div class="lima-chart">
  <div class="lima-row"><div class="lima-row-label">Curated LIMA (1k)</div><div class="lima-row-bar good">~high win rate</div></div>
  <div class="lima-row"><div class="lima-row-label">Web Scraps (100k+)</div><div class="lima-row-bar bad">~lower win rate</div></div>
</div>
<div class="frame counts">
  <div class="frame-label">Definition: Human Win Rate</div>
  Blind A/B tests where human experts compare two anonymous model outputs for the same prompt. If Model A wins 75/100 matchups, its win rate is 75%.
</div>
<div class="landscape-note"><strong>LIMA (Less Is More for Alignment):</strong> 1,000 meticulously filtered, high-quality instruction responses consistently outperform massive, multi-thousand-sample datasets full of noise and repetitive patterns — the "not too little, not too cheap" data from two slides ago, taken to its extreme.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="sft" data-marpit-pagination="9" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="training-same-loss-adapted-rules">Training: Same Loss, Adapted Rules</h1>
<div class="frame">
  <code>&lt;|user|&gt; What is 2+2? &lt;|assistant|&gt;</code> <strong class="gold-answer"><code>The answer is 4.</code></strong>
</div>
<div class="formula-box">
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="script">L</mi><mo>=</mo><mo>−</mo><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mi>i</mi></mrow><mi>N</mi></munderover><mi>log</mi><mo>⁡</mo><mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>t</mi></msub><mo>∣</mo><msub><mi>x</mi><mrow><mo>&lt;</mo><mi>t</mi></mrow></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal{L} = -\sum_{t=i}^{N} \log P(x_t \mid x_{&lt;t})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal">L</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:3.106em;vertical-align:-1.2777em;"></span><span class="mord">−</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.8283em;"><span style="top:-1.8723em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mrel mtight">=</span><span class="mord mathnormal mtight">i</span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span><span style="top:-4.3em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.10903em;">N</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2777em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.01389em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.13889em;">P</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mrel mtight">&lt;</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1774em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p></div>
<p class="slide-caption"><em>Identical to pre-training's next-token loss — where i is the first token of the assistant's answer</em></p>
<ul>
<li><strong>No new objective:</strong> SFT is the same cross-entropy next-token prediction as pre-training.</li>
<li><strong>Masking:</strong> the loss is only computed on assistant tokens — the model isn't penalized for &quot;predicting&quot; the prompt it was given.</li>
<li><strong>Chat template tokens</strong> (e.g. <code>&lt;|im_start|&gt;</code>/<code>&lt;|im_end|&gt;</code>) mark where each turn begins and ends, so the mask — and the model's own stop condition — has something reliable to key on.</li>
<li><strong>Learning rate:</strong> dropped 1-2 orders of magnitude vs. pre-training (~2e-5 full fine-tuning, ~1e-4 LoRA) — we're adapting a trained model, not learning from scratch.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="sft" data-marpit-pagination="10" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="prompt-engineering-vs-domain-sft">Prompt Engineering vs. Domain SFT</h1>
<div class="decode-table-wrap">
  <table class="decode-table">
    <thead>
      <tr><th>Metric</th><th>Prompt Engineering (Few-Shot)</th><th>Supervised Fine-Tuning (SFT)</th></tr>
    </thead>
    <tbody>
      <tr><td>Upfront Cost</td><td>$0 — immediate setup via API</td><td>High — data collection + GPU rent</td></tr>
      <tr><td>Cost Per Request</td><td>High — paying for examples every time</td><td>Minimal — short, clean prompts</td></tr>
      <tr><td>Format Reliability</td><td>Weak — model can drift or forget rules</td><td>Hardcoded — baked into model weights</td></tr>
    </tbody>
  </table>
</div>
<div class="landscape-note">This is really a choice between prompt engineering and <em>domain</em> SFT specifically (recall slide 3) — an already instruction-following model can often be steered by examples instead of retrained. It's not a substitute for alignment SFT: a base model has no instruction-following behavior to prompt-engineer in the first place.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="sft" data-marpit-pagination="11" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="a-third-axis-in-context-learning--rag">A Third Axis: In-Context Learning &amp; RAG</h1>
<div class="flow-steps">
  <div class="step">Query</div>
  <div class="arrow">&rarr;</div>
  <div class="step highlight">Retrieve<br /><small>relevant docs / examples</small></div>
  <div class="arrow">&rarr;</div>
  <div class="step">Inject into<br />Context</div>
  <div class="arrow">&rarr;</div>
  <div class="step">Model Answers<br /><small>no weight update</small></div>
</div>
<ul>
<li><strong>In-context learning:</strong> few-shot examples or instructions placed directly in the prompt — no training, forgotten the moment the request ends.</li>
<li><strong>RAG (Retrieval-Augmented Generation):</strong> automates <em>what</em> goes into that context, pulling relevant passages from a knowledge base instead of hand-picking examples.</li>
</ul>
<div class="landscape-note">SFT bakes behavior into the weights — durable, cheap per request, but paid for upfront. RAG/ICL instead change what's in the context window — cheap to update (edit the knowledge base, not retrain), but you pay the retrieval and longer-context cost on every single request. Rule of thumb: reach for RAG when what's changing is <em>knowledge</em>; reach for SFT when what's changing is <em>behavior</em>.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="sft" data-marpit-pagination="12" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="full-fine-tuning-vs-peft-lora">Full Fine-Tuning vs. PEFT (LoRA)</h1>
<div class="mini-cols mini-cols-lg">
  <div class="mini-col">
    <div class="mini-title">Full Fine-Tuning (FT)</div>
    <div class="delta-grid">
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
    </div>
    <p class="mini-note">Every parameter updates. High risk of catastrophic forgetting; massive VRAM for gradients + optimizer states.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">PEFT — Variant, Not Alternative</div>
    <div class="lora-diagram">
      <div class="lora-frozen">Frozen</div>
      <div class="lora-op">+</div>
      <div class="lora-ba-col">
        <div class="lora-A">A</div>
      </div>
      <div class="lora-B end">B</div>
    </div>
    <p class="mini-note">Still SFT — same masked CE loss, same data. Only a tiny fraction of parameters (the LoRA matrices) actually train; the base model stays frozen.</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="sft" data-marpit-pagination="13" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="lora-inside-the-transformer">LoRA Inside the Transformer</h1>
<div class="transformer-block">
  <div class="tb-layer">
    <div class="tb-layer-label">Multi-Head Self-Attention</div>
    <div class="tb-matrices">
      <span class="tb-matrix lora">W<sub>q</sub></span>
      <span class="tb-matrix lora">W<sub>k</sub></span>
      <span class="tb-matrix lora">W<sub>v</sub></span>
      <span class="tb-matrix lora">W<sub>o</sub></span>
    </div>
  </div>
  <div class="tb-layer">
    <div class="tb-layer-label">Feed-Forward (MLP)</div>
    <div class="tb-matrices">
      <span class="tb-matrix">W<sub>up</sub></span>
      <span class="tb-matrix">W<sub>down</sub></span>
    </div>
  </div>
</div>
<div class="formula-box">
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>W</mi><mrow><mi mathvariant="normal">n</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">w</mi></mrow></msub><mo>=</mo><msub><mi>W</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi>α</mi><mi>r</mi></mfrac><mo stretchy="false">(</mo><mi>B</mi><mo>×</mo><mi>A</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="1em"/><mi>A</mi><mo>∈</mo><msup><mi mathvariant="double-struck">R</mi><mrow><mi>r</mi><mo>×</mo><mi>d</mi></mrow></msup><mo separator="true">,</mo><mtext> </mtext><mi>B</mi><mo>∈</mo><msup><mi mathvariant="double-struck">R</mi><mrow><mi>d</mi><mo>×</mo><mi>r</mi></mrow></msup></mrow><annotation encoding="application/x-tex">W_{\mathrm{new}} = W_0 + \frac{\alpha}{r}(B \times A), \quad A \in \mathbb{R}^{r \times d},\ B \in \mathbb{R}^{d \times r}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight" style="margin-right:0.01389em;">new</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.7936em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.1076em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.02778em;">r</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0037em;">α</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.05017em;">B</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mclose">)</span><span class="mpunct">,</span><span class="mspace" style="margin-right:1em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0935em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathbb">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8991em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.02778em;">r</span><span class="mbin mtight">×</span><span class="mord mathnormal mtight">d</span></span></span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.05017em;">B</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8991em;"></span><span class="mord"><span class="mord mathbb">R</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8991em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">d</span><span class="mbin mtight">×</span><span class="mord mathnormal mtight" style="margin-right:0.02778em;">r</span></span></span></span></span></span></span></span></span></span></span></span></span></p></div>
<ul>
<li><strong>Targeted, not global:</strong> each adapted matrix gets its own low-rank pair (A, B) — LoRA is applied per-weight-matrix, not once to the whole model.</li>
<li><strong>Attention first:</strong> W<sub>q</sub>/W<sub>k</sub>/W<sub>v</sub>/W<sub>o</sub> are the standard targets — they control <em>what the model attends to</em>, which is usually enough to teach a new format or behavior.</li>
<li><strong>MLP is optional:</strong> the feed-forward matrices are larger (higher-dimensional) and hold more of the model's factual/world knowledge — adapting them costs more but helps when the task needs new knowledge pathways, not just re-weighted attention.</li>
</ul>
<p class="slide-caption">Highlighted = typical LoRA targets. Frozen weights throughout.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="title-slide" data-theme="sft" class="title-slide" data-marpit-pagination="14" style="--paginate:true;--class:title-slide;--theme:sft;" data-marpit-pagination-total="27"><div class="kicker">Archive</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="sft" data-marpit-pagination="15" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="prompt-engineering-vs-sft-the-core-tradeoff">Prompt Engineering vs. SFT: The Core Tradeoff</h1>
<div class="decode-table-wrap">
  <table class="decode-table">
    <thead>
      <tr><th>Metric</th><th>Prompt Engineering (Few-Shot)</th><th>Supervised Fine-Tuning (SFT)</th></tr>
    </thead>
    <tbody>
      <tr><td>Upfront Cost</td><td>$0 — immediate setup via API</td><td>High — data collection + GPU rent</td></tr>
      <tr><td>Cost Per Request</td><td>High — paying for examples every time</td><td>Minimal — short, clean prompts</td></tr>
      <tr><td>Format Reliability</td><td>Weak — model can drift or forget rules</td><td>Hardcoded — baked into model weights</td></tr>
    </tbody>
  </table>
</div>
<div class="landscape-note">Optimization path: cheap, ad-hoc customization (prompting) trades off against low per-request cost and durable behavior (SFT) as usage scales.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="sft" data-marpit-pagination="16" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="the-anatomy-of-an-instruction-dataset">The Anatomy of an Instruction Dataset</h1>
<p><strong>ChatML / OpenAI JSON template structure</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">[</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;system&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;You are a helpful coding assistant.&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;user&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;How do I reverse a list in Python?&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;assistant&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;You can reverse a list using `list.reverse()` or slicing `[::-1]`.&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">]</span>
</code></pre>
<div class="formula-box">[Prompt] + [Assistant] &rarr; Loss</div>
<p class="slide-caption"><strong>The Gold Target</strong> — loss is calculated ONLY on the assistant response.</p>
<ul>
<li><strong>System:</strong> defines boundaries/tone.</li>
<li><strong>User:</strong> input instructions.</li>
<li><strong>Assistant:</strong> the training target.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="sft" data-marpit-pagination="17" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="quality-over-quantity-the-lima-effect-1">Quality Over Quantity: The LIMA Effect</h1>
<div class="lima-chart">
  <div class="lima-row"><div class="lima-row-label">Curated LIMA (1k)</div><div class="lima-row-bar good">~high win rate</div></div>
  <div class="lima-row"><div class="lima-row-label">Web Scraps (100k+)</div><div class="lima-row-bar bad">~lower win rate</div></div>
</div>
<div class="frame counts">
  <div class="frame-label">Definition: Human Win Rate</div>
  Blind A/B tests where human experts compare two anonymous model outputs for the same prompt. If Model A wins 75/100 matchups, its win rate is 75%.
</div>
<div class="landscape-note"><strong>LIMA (Less Is More for Alignment):</strong> a tiny set of 1,000 meticulously filtered, high-quality instruction responses consistently outperforms massive, multi-thousand-sample datasets full of noise and repetitive patterns.</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="sft" data-marpit-pagination="18" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="data-synthetic-generation-self-instruct">Data Synthetic Generation (Self-Instruct)</h1>
<div class="flow-steps">
  <div class="step">Teacher Model<br /><small>(e.g. GPT-4)</small></div>
  <div class="arrow">&rarr;</div>
  <div class="step">Raw Prompt &amp;<br />Response Generation</div>
  <div class="arrow">&rarr;</div>
  <div class="step">Filtering<br /><small>Heuristics &amp; LLM-eval</small></div>
  <div class="arrow">&rarr;</div>
  <div class="step highlight">Student Model<br /><small>SFT Engine</small></div>
</div>
<div class="landscape-note">The student model's outputs can loop back to seed the next generation round (dashed feedback in the original pipeline).</div>
<ul>
<li><strong>Pipeline:</strong> seed tasks → generation loops → deduplication checks → target training.</li>
<li><strong>Pitfall:</strong> risk of data echo chambers — repeating systemic hallucination footprints of the teacher.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="sft" data-marpit-pagination="19" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="the-necessity-of-chat-templates">The Necessity of Chat Templates</h1>
<p><strong>The Challenge: Text Completion vs. Interaction</strong></p>
<ul>
<li><strong>Base model behavior:</strong> predicts the next word in a sequence. Without structure, it treats a prompt as a <em>continuation</em> of text (e.g., finishing your question).</li>
<li><strong>The goal:</strong> turn an open-ended generator into a controlled <em>dialogue agent</em>.</li>
</ul>
<div class="verdict-grid">
  <div class="verdict-box good">
    <div class="verdict-label">Expectation (Controlled)</div>
    <code>User: 4+4?</code><br /><code>Assistant: 8</code><br /><code>[STOP TOKEN]</code>
  </div>
  <div class="verdict-box bad">
    <div class="verdict-label">Reality (Uncontrolled — Role Bleeding)</div>
    <code>User: 4+4?</code><br /><code>Assistant: 8</code><br /><strong><code>User: And what is 5+5?</code><br /><code>Assistant: 10</code></strong><br /><code>[STOP TOKEN]</code>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="sft" data-marpit-pagination="20" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="the-solution-chat-templates">The Solution: Chat Templates</h1>
<p><strong>Enforcing boundaries with special tokens</strong></p>
<div class="verdict-box good">
  <div class="verdict-label">Model respects the structure</div>
  <code>&lt;|im_start|&gt;User: What is 4+4?&lt;|im_end|&gt;</code><br /><code>&lt;|im_start|&gt;Assistant: 8&lt;|im_end|&gt;</code>
</div>
<ul>
<li><strong>Containment:</strong> the model is confined to the marked scope.</li>
<li><strong>Control:</strong> the <code>&lt;|im_end|&gt;</code> tag serves as an explicit &quot;Stop&quot; signal for the tokenizer.</li>
</ul>
<div class="frame step">
  <div class="frame-label">Crucial technical step</div>
  Tags must be registered as <strong>Special Tokens</strong> to prevent fragmentation.<br />
  Fix: <code>tokenizer.add_special_tokens()</code> &rarr; <code>model.resize_token_embeddings()</code>.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="sft" data-marpit-pagination="21" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="standard-sft-loss-function">Standard SFT Loss Function</h1>
<div class="frame">
  <code>&lt;|user|&gt; What is 2+2? &lt;|assistant|&gt;</code> <strong class="gold-answer"><code>The answer is 4.</code></strong>
</div>
<div class="formula-box">
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="script">L</mi><mo>=</mo><mo>−</mo><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mi>i</mi></mrow><mi>N</mi></munderover><mi>log</mi><mo>⁡</mo><mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>t</mi></msub><mo>∣</mo><msub><mi>x</mi><mrow><mo>&lt;</mo><mi>t</mi></mrow></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal{L} = -\sum_{t=i}^{N} \log P(x_t \mid x_{&lt;t})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal">L</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:3.106em;vertical-align:-1.2777em;"></span><span class="mord">−</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.8283em;"><span style="top:-1.8723em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mrel mtight">=</span><span class="mord mathnormal mtight">i</span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span><span style="top:-4.3em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.10903em;">N</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2777em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.01389em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.13889em;">P</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mrel mtight">&lt;</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1774em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p></div>
<p class="slide-caption"><em>where i is the first token of the assistant's answer</em></p>
<ul>
<li><strong>Masked multi-turn loss:</strong> only the assistant's response contributes to the loss.</li>
<li><strong>Gradient flow:</strong> backpropagation is constrained to target tokens, forcing the model to learn answer generation, not prompt replication.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="sft" data-marpit-pagination="22" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="full-fine-tuning-vs-peft">Full Fine-Tuning vs. PEFT</h1>
<div class="mini-cols">
  <div class="mini-col">
    <div class="mini-title">Full Fine-Tuning (FT)</div>
    <div class="delta-grid">
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
      <div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div><div class="delta-cell">&Delta;&theta;</div>
    </div>
    <p class="mini-note">Modifies every single parameter. High risk of catastrophic forgetting. Massive VRAM requirements to maintain gradients and optimizer states.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">PEFT (LoRA)</div>
    <div class="lora-diagram">
      <div class="lora-frozen">Frozen</div>
      <div class="lora-op">+</div>
      <div class="lora-ba-col">
        <div class="lora-A">A</div>
      </div>
      <div class="lora-B end">B</div>
    </div>
    <p class="mini-note"><strong>Strategy:</strong> train only a tiny fraction of parameters. Base model remains locked (99%+ frozen). Injects trainable matrices A, B: &Delta;W = AB.</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="sft" data-marpit-pagination="23" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="inside-lora-low-rank-adaptation">Inside LoRA (Low-Rank Adaptation)</h1>
<div class="formula-box">
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>W</mi><mrow><mi mathvariant="normal">n</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">w</mi></mrow></msub><mo>=</mo><msub><mi>W</mi><mn>0</mn></msub><mo>+</mo><mi mathvariant="normal">Δ</mi><mi>W</mi><mo>=</mo><msub><mi>W</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi>α</mi><mi>r</mi></mfrac><mo stretchy="false">(</mo><mi>B</mi><mo>×</mo><mi>A</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">W_{\mathrm{new}} = W_0 + \Delta W = W_0 + \frac{\alpha}{r}(B \times A)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight" style="margin-right:0.01389em;">new</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.7936em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.1076em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.02778em;">r</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0037em;">α</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.05017em;">B</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mclose">)</span></span></span></span></span></p></div>
<div class="lora-diagram">
  <div class="lora-frozen mini">W<sub>0</sub> &isin; &#8477;<sup>d&times;d</sup></div>
  <div class="lora-op">+</div>
  <div class="lora-A mini">A &isin; &#8477;<sup>d&times;r</sup></div>
  <div class="lora-op">&times;</div>
  <div class="lora-B mini">B &isin; &#8477;<sup>r&times;d</sup></div>
</div>
<div class="decode-table-wrap">
  <table class="decode-table">
    <thead><tr><th>Method</th><th>Trainable Params / Layer</th></tr></thead>
    <tbody>
      <tr><td>Full FT</td><td>~16.8M (d=4096)</td></tr>
      <tr><td>LoRA (r=8)</td><td>~65K &mdash; &asymp;256&times; reduction</td></tr>
    </tbody>
  </table>
</div>
<ul>
<li><strong>Assumption:</strong> target adjustments ΔW feature highly reduced intrinsic rank.</li>
<li><strong>Setup:</strong> A initializes Gaussian; B initializes at zero → ΔW = 0 at step zero.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="sft" data-marpit-pagination="24" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="memory-layout-quantization--qlora">Memory Layout: Quantization &amp; QLoRA</h1>
<div class="quant-bars">
  <div class="quant-bar fp32">FP32</div>
  <div class="quant-bar fp16">FP16</div>
  <div class="quant-bar nf4">NF4</div>
</div>
<div class="quant-bar-labels">
  <span class="quant-bar-label">4 Bytes</span>
  <span class="quant-bar-label">2 Bytes</span>
  <span class="quant-bar-label">0.5 Bytes</span>
</div>
<p><strong>VRAM footprint for a standard 7B parameter model:</strong></p>
<div class="decode-table-wrap">
  <table class="decode-table">
    <thead><tr><th>Precision Mode</th><th>Data Format</th><th>Weights Footprint</th><th>Total VRAM for SFT</th></tr></thead>
    <tbody>
      <tr><td>Full Precision</td><td>FP32</td><td>~28 GB</td><td>~112 GB (incl. states)</td></tr>
      <tr><td>Half Precision</td><td>FP16 / BF16</td><td>~14 GB</td><td>~40-50 GB</td></tr>
      <tr><td>QLoRA</td><td>NF4 (NormalFloat4)</td><td>~4.5 GB</td><td>&lt; 8 GB (consumer-grade GPU)</td></tr>
    </tbody>
  </table>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="sft" data-marpit-pagination="25" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="hyperparameters-that-actually-matter">Hyperparameters That Actually Matter</h1>
<div class="mini-cols">
  <div class="mini-col">
    <div class="mini-title">Learning Rate</div>
    <div class="lr-bar"></div>
    <p class="small-note"><strong>Cosine decay schedule</strong> — high &rarr; low.<br />~1e-4 for LoRA runs.<br />~2e-5 for full FT runs.<br />Magnitudes lower than pre-training rates.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">Batch Size</div>
    <div class="batch-boxes">
      <div class="batch-box"></div><div class="batch-box"></div><div class="batch-box"></div><div class="batch-box"></div>
    </div>
    <p class="small-note"><strong>Effective batch size:</strong> samples processed before updating weights (target: 32-128).<br /><strong>Gradient accumulation:</strong> sum gradients over mini-batches when GPU is too small, then update once.</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">Context Strategy</div>
    <div class="context-strip"><div class="seg-full"></div><div class="seg-used"></div><div class="seg-pad"></div></div>
    <p class="small-note"><strong>Padding:</strong> wastes tensor space via zero allocation.<br /><strong>Packing:</strong> chains short strings sequentially, separated by EOS tokens, to maximize sequence efficiency.</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="sft" data-marpit-pagination="26" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="fine-tuning-challenges-overfitting--forgetting">Fine-tuning Challenges: Overfitting &amp; Forgetting</h1>
<div class="mini-cols">
  <div class="mini-col">
    <div class="mini-title">1. Overfitting</div>
    <p class="small-note">Model memorizes noise instead of patterns. Train loss keeps falling; validation loss falls, then turns back up — that turning point is where to stop.</p>
    <p class="small-note"><strong>Solution:</strong> Early Stopping</p>
  </div>
  <div class="mini-col">
    <div class="mini-title">2. Catastrophic Forgetting</div>
    <p class="small-note">New skills override base general intelligence.</p>
    <div class="stack-bar-wrap">
      <div class="stack-bar">
        <div class="stack-seg anchor">10% Web Tokens</div>
        <div class="stack-seg sft">90% SFT Dataset</div>
      </div>
    </div>
    <p class="small-note"><strong>Mitigation:</strong> Data Rehearsal</p>
  </div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="sft" data-marpit-pagination="27" style="--paginate:true;--theme:sft;" data-marpit-pagination-total="27">
<h1 id="how-to-evaluate-an-sft-model">How to Evaluate an SFT Model?</h1>
<div class="bottleneck-grid">
  <div class="bottleneck-tile">
    <div class="bottleneck-title">Benchmarks</div>
    <div class="bottleneck-sub">MMLU, GSM8K, HumanEval<br /><em>(rigid metrics / ground-truth match)</em></div>
  </div>
  <div class="bottleneck-tile">
    <div class="bottleneck-title">LLM-as-a-Judge</div>
    <div class="bottleneck-sub">GPT-4 Evaluation, MT-Bench<br /><em>(relative quality checks using strong models)</em></div>
  </div>
  <div class="bottleneck-tile">
    <div class="bottleneck-title">Human Evaluation</div>
    <div class="bottleneck-sub">Side-by-side A/B testing<br /><em>(gold standard verification; resource heavy)</em></div>
  </div>
</div>
<div class="landscape-note"><strong>Legacy text metrics (ROUGE / BLEU):</strong> mostly ineffective for abstract alignment tracking — language answers change shape without affecting accuracy.</div>
